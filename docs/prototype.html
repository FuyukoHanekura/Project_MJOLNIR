<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Carnet de salle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #F1F3F8;
            --surface: #FFFFFF;
            --ink: #16203A;
            --ink2: #4B5670;
            --muted: #7C879F;
            --line: #D8DDE9;
            --accent: #3B2EC9;
            --accent-ink: #FFFFFF;
            --body: #E7EAF2;
            --m0: #D3D8E7;
            --danger: #C1213E;
            --scrim: rgba(14, 20, 40, .55);
            --display: 'Big Shoulders Display', 'Arial Narrow', 'Helvetica Neue', sans-serif;
            --text: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0D111F;
                --surface: #151B2E;
                --ink: #EDEFF8;
                --ink2: #B0B8CF;
                --muted: #8791AB;
                --line: #28314A;
                --accent: #9A91FF;
                --accent-ink: #0D111F;
                --body: #1B2338;
                --m0: #2C3654;
                --danger: #FF7088;
                --scrim: rgba(0, 0, 0, .6);
            }
        }

        :root[data-theme="dark"] {
            --bg: #0D111F;
            --surface: #151B2E;
            --ink: #EDEFF8;
            --ink2: #B0B8CF;
            --muted: #8791AB;
            --line: #28314A;
            --accent: #9A91FF;
            --accent-ink: #0D111F;
            --body: #1B2338;
            --m0: #2C3654;
            --danger: #FF7088;
            --scrim: rgba(0, 0, 0, .6);
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 16px/1.5 var(--text);
            -webkit-text-size-adjust: 100%
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
            color: inherit
        }

        button {
            cursor: pointer
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px
        }

        h1,
        h2,
        h3 {
            margin: 0;
            font-family: var(--display);
            font-weight: 800;
            letter-spacing: .01em;
            line-height: 1.05
        }

        h1 {
            font-size: 38px
        }

        h2 {
            font-size: 26px
        }

        h3 {
            font-size: 20px
        }

        p {
            margin: 0
        }

        .muted {
            color: var(--muted)
        }

        .app {
            display: flex;
            min-height: 100vh
        }

        .nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            display: flex;
            background: var(--surface);
            border-top: 1px solid var(--line);
            padding-bottom: env(safe-area-inset-bottom)
        }

        .nav .brand {
            display: none
        }

        .nav button {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 9px 4px 8px;
            background: none;
            border: 0;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600
        }

        .nav button svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .nav button[aria-current="page"] {
            color: var(--accent)
        }

        .nav .nav-cta {
            display: none
        }

        main {
            flex: 1;
            min-width: 0;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 16px 110px
        }

        .viewhead {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px
        }

        .viewhead .sub {
            color: var(--ink2);
            font-size: 14px;
            margin-top: 6px
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: var(--accent);
            color: var(--accent-ink);
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 9px 16px;
            font-weight: 600;
            white-space: nowrap
        }

        .btn.ghost {
            background: transparent;
            color: var(--ink);
            border-color: var(--line)
        }

        .btn.danger {
            background: transparent;
            color: var(--danger);
            border-color: var(--danger)
        }

        .btn.small {
            padding: 5px 11px;
            font-size: 14px
        }

        .link {
            background: none;
            border: 0;
            padding: 0;
            color: var(--accent);
            font-weight: 600;
            text-align: left
        }

        .seg {
            display: inline-flex;
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
            background: var(--surface)
        }

        .seg button {
            background: transparent;
            border: 0;
            padding: 7px 13px;
            color: var(--ink2);
            font-weight: 600;
            font-size: 14px
        }

        .seg button[aria-pressed="true"] {
            background: var(--ink);
            color: var(--bg)
        }

        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .chips.scroll {
            flex-wrap: nowrap;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: thin
        }

        .chip {
            flex: none;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: transparent;
            padding: 5px 13px;
            color: var(--ink2);
            font-size: 14px;
            font-weight: 500
        }

        .chip[aria-pressed="true"] {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-ink)
        }

        .tag {
            display: inline-block;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 0 7px;
            font-size: 12px;
            color: var(--ink2);
            line-height: 20px;
            white-space: nowrap
        }

        input[type=text],
        input[type=search],
        input[type=date],
        input[type=number],
        textarea {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 9px 12px
        }

        textarea {
            min-height: 84px;
            resize: vertical
        }

        label.f {
            display: block;
            font-size: 13px;
            color: var(--ink2);
            font-weight: 600
        }

        label.f>input,
        label.f>textarea {
            margin-top: 4px;
            font-weight: 400;
            color: var(--ink)
        }

        .block {
            margin-top: 34px
        }

        .block>h2 {
            margin-bottom: 12px
        }

        .block-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px
        }

        .block-head h2 {
            margin: 0
        }

        /* Hero : cartes de chaleur du corps */
        .stage {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 14px
        }

        .stage-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 10px
        }

        .legend {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--muted)
        }

        .legend .grad {
            width: 110px;
            height: 8px;
            border-radius: 4px
        }

        .stage-body {
            display: grid;
            gap: 18px
        }

        .figs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            align-items: end
        }

        .figs figure {
            margin: 0;
            text-align: center
        }

        .figs svg {
            width: 100%;
            height: auto;
            max-height: 540px;
            display: block
        }

        .figs figcaption {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px
        }

        .base * {
            fill: var(--body)
        }

        .mu {
            fill: var(--m0)
        }

        .mu * {
            stroke: var(--surface);
            stroke-width: 1
        }

        .mu[data-act] {
            cursor: pointer
        }

        .mu[data-act]:hover * {
            stroke: var(--ink);
            stroke-width: 1.5
        }

        .mu.sel * {
            stroke: var(--ink);
            stroke-width: 2
        }

        .mu:focus-visible {
            outline: none
        }

        .mu:focus-visible * {
            stroke: var(--accent);
            stroke-width: 2.4
        }

        .selinfo {
            min-height: 74px;
            padding: 2px 2px 12px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 6px
        }

        .selinfo strong {
            font-family: var(--display);
            font-size: 24px;
            font-weight: 800;
            display: block;
            line-height: 1.1
        }

        .selinfo p {
            font-size: 14px;
            color: var(--ink2);
            margin: 2px 0 6px
        }

        .rank {
            list-style: none;
            margin: 0;
            padding: 0
        }

        .rk {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 2px 10px;
            width: 100%;
            background: none;
            border: 0;
            padding: 7px 4px;
            text-align: left;
            border-radius: 8px
        }

        .rk:hover {
            background: var(--bg)
        }

        .rk.sel {
            background: var(--bg)
        }

        .rk-name {
            font-size: 15px;
            font-weight: 500
        }

        .rk-val {
            font-size: 13px;
            color: var(--ink2);
            font-variant-numeric: tabular-nums
        }

        .rk-bar {
            grid-column: 1/-1;
            height: 5px;
            border-radius: 3px;
            background: var(--m0);
            overflow: hidden
        }

        .rk-bar i {
            display: block;
            height: 100%;
            border-radius: 3px
        }

        /* Calendrier */
        .cal-wrap {
            display: flex;
            gap: 6px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px 12px
        }

        .cal-days {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding-top: 19px;
            font-size: 11px;
            color: var(--muted);
            flex: none
        }

        .cal-days span {
            height: 14px;
            line-height: 14px
        }

        .cal {
            overflow-x: auto;
            flex: 1;
            min-width: 0;
            padding-bottom: 4px
        }

        .cal-cols {
            display: flex;
            gap: 3px;
            width: max-content
        }

        .wk {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 14px
        }

        .mlabel {
            height: 16px;
            font-size: 11px;
            line-height: 16px;
            color: var(--muted);
            white-space: nowrap;
            margin-bottom: 0
        }

        .cell {
            width: 14px;
            height: 14px;
            padding: 0;
            border: 0;
            border-radius: 3px;
            background: var(--m0);
            display: block
        }

        .cell.off {
            background: transparent
        }

        .cell.sel {
            outline: 2px solid var(--ink);
            outline-offset: 1px
        }

        .calinfo {
            font-size: 14px;
            color: var(--ink2);
            margin-top: 10px;
            min-height: 24px
        }

        .calinfo b {
            color: var(--ink)
        }

        .cal-legend {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--muted);
            margin-top: 8px;
            justify-content: flex-end
        }

        .cal-legend i {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            display: inline-block
        }

        .empty {
            border: 1px dashed var(--line);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            color: var(--ink2);
            font-size: 15px
        }

        .empty .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px
        }

        /* Listes */
        .list {
            list-style: none;
            margin: 0;
            padding: 0;
            border-top: 1px solid var(--line)
        }

        .list>li {
            border-bottom: 1px solid var(--line)
        }

        .month {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 26px 0 8px
        }

        .month h3 {
            text-transform: none
        }

        .month span {
            font-size: 13px;
            color: var(--muted)
        }

        .srow {
            display: grid;
            grid-template-columns: 56px 1fr auto;
            gap: 12px;
            width: 100%;
            background: none;
            border: 0;
            padding: 12px 2px;
            text-align: left;
            align-items: start
        }

        .srow:hover {
            background: color-mix(in srgb, var(--surface) 70%, transparent)
        }

        .sdate {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1
        }

        .sdate b {
            font-family: var(--display);
            font-size: 32px;
            font-weight: 800
        }

        .sdate small {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px
        }

        .sbody strong {
            display: block;
            font-size: 17px
        }

        .ssum {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-size: 14px;
            color: var(--ink2);
            margin-top: 2px
        }

        .smeta {
            font-size: 13px;
            color: var(--muted);
            text-align: right;
            font-variant-numeric: tabular-nums;
            white-space: nowrap
        }

        .xrow {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            width: 100%;
            background: none;
            border: 0;
            padding: 11px 2px;
            text-align: left;
            align-items: center
        }

        .xrow:hover {
            background: color-mix(in srgb, var(--surface) 70%, transparent)
        }

        .xrow strong {
            display: block;
            font-weight: 600
        }

        .xrow small {
            color: var(--muted);
            font-size: 13px
        }

        .controls {
            display: grid;
            gap: 10px;
            margin-bottom: 12px
        }

        .count {
            font-size: 13px;
            color: var(--muted);
            margin: 2px 0 8px
        }

        /* Panneaux superposés */
        .scrim {
            position: fixed;
            inset: 0;
            background: var(--scrim);
            z-index: 50
        }

        .sheet {
            position: fixed;
            inset: 0;
            z-index: 51;
            background: var(--surface);
            display: flex;
            flex-direction: column
        }

        #ov-picker .scrim,
        #ov-picker .sheet {
            z-index: 60
        }

        #ov-picker .sheet {
            z-index: 61
        }

        #ov-detail .scrim {
            z-index: 70
        }

        #ov-detail .sheet {
            z-index: 71
        }

        .sheet-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
            flex: none
        }

        .sheet-head h2 {
            font-size: 24px;
            flex: 1;
            text-align: center
        }

        .sheet-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 40px;
            -webkit-overflow-scrolling: touch
        }

        .sheet-body>*+* {
            margin-top: 18px
        }

        @media (prefers-reduced-motion:no-preference) {
            .sheet {
                animation: up .22s ease-out
            }

            @keyframes up {
                from {
                    transform: translateY(24px);
                    opacity: 0
                }

                to {
                    transform: none;
                    opacity: 1
                }
            }
        }

        .row2 {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 10px
        }

        .entry {
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px
        }

        .entry-head {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            align-items: flex-start
        }

        .entry-head .nm {
            font-weight: 700;
            font-size: 17px
        }

        .entry-tools {
            display: flex;
            gap: 4px;
            flex: none
        }

        .entry-tools button {
            background: none;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 2px 9px;
            color: var(--ink2);
            font-size: 13px
        }

        .hint {
            font-size: 13px;
            color: var(--muted);
            margin: 2px 0 8px
        }

        .sets {
            display: grid;
            gap: 6px
        }

        .sets .sr {
            display: grid;
            grid-template-columns: 26px 1fr 1fr 34px;
            gap: 8px;
            align-items: center
        }

        .sets .sr.h {
            font-size: 12px;
            color: var(--muted)
        }

        .sets .n {
            font-family: var(--display);
            font-weight: 800;
            font-size: 18px;
            text-align: center;
            color: var(--ink2)
        }

        .sets input {
            text-align: center;
            padding: 8px 6px
        }

        .sets .x {
            background: none;
            border: 0;
            color: var(--muted);
            font-size: 20px;
            line-height: 1
        }

        .dashed {
            width: 100%;
            border: 1.5px dashed var(--line);
            background: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            color: var(--accent)
        }

        .foot-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .figs-s {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            max-width: 320px;
            margin: 0 auto
        }

        .figs-s figure {
            margin: 0;
            text-align: center
        }

        .figs-s svg {
            width: 100%;
            height: auto;
            display: block
        }

        .figs-s figcaption {
            font-size: 12px;
            color: var(--muted)
        }

        .keys {
            display: flex;
            gap: 14px;
            justify-content: center;
            font-size: 13px;
            color: var(--ink2);
            margin-top: 6px
        }

        .keys i {
            display: inline-block;
            width: 11px;
            height: 11px;
            border-radius: 3px;
            margin-right: 5px;
            vertical-align: -1px
        }

        .dsec h3 {
            margin-bottom: 6px
        }

        .dsec p {
            color: var(--ink2);
            font-size: 15px
        }

        .xchips {
            display: grid;
            gap: 8px
        }

        .xchip {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0;
            width: 100%;
            text-align: left;
            background: none;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 9px 12px
        }

        .xchip span {
            font-weight: 600
        }

        .xchip small {
            color: var(--muted);
            font-size: 13px
        }

        .xchip:hover {
            border-color: var(--accent)
        }

        .mlist {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .hist {
            display: grid;
            gap: 4px;
            font-size: 14px;
            color: var(--ink2)
        }

        .hist div {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid var(--line);
            padding: 4px 0
        }

        .pr {
            font-size: 15px
        }

        .pr b {
            font-family: var(--display);
            font-size: 22px;
            font-weight: 800;
            color: var(--ink)
        }

        .panel {
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
            background: var(--surface)
        }

        .panel+.panel {
            margin-top: 12px
        }

        .panel h3 {
            margin-bottom: 4px
        }

        .panel p {
            color: var(--ink2);
            font-size: 15px;
            margin-bottom: 10px
        }

        .panel .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .panel textarea {
            font-size: 13px;
            font-family: ui-monospace, Menlo, monospace;
            min-height: 120px;
            margin-bottom: 10px
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 90px;
            transform: translateX(-50%);
            background: var(--ink);
            color: var(--bg);
            padding: 9px 16px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 100;
            max-width: 90vw;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s
        }

        .toast.on {
            opacity: 1
        }

        @media (min-width:640px) {

            .cell,
            .cal-days span {
                height: 16px
            }

            .cell,
            .wk {
                width: 16px
            }

            .cal-days span {
                line-height: 16px
            }

            .srow {
                grid-template-columns: 64px 1fr 130px
            }
        }

        @media (min-width:900px) {
            main {
                padding: 34px 40px 64px
            }

            .nav {
                position: sticky;
                top: 0;
                left: auto;
                right: auto;
                bottom: auto;
                height: 100vh;
                width: 212px;
                flex: none;
                flex-direction: column;
                border-top: 0;
                border-right: 1px solid var(--line);
                padding: 26px 14px;
                gap: 4px
            }

            .nav .brand {
                display: block;

            }

            }

            }

            }

            }

            }

                align-items: start
            }

                height: 90vh;
                border-radius: 18px;
                overflow: hidden;
                box-shadow: 0 24px 80px rgba(0, 0, 0, .35)
            }

            .sheet.drawer {
                inset: 0 0 0 auto;
                width: 540px;
                border-left: 1px solid var(--line)
            }

                .sheet.center {
                    animation: none
                }

                    animation: in .22s ease-out
                }

                    from {
                        transform: translateX(30px);
                        opacity: 0
                    }

                    to {
                        transform: none;
                        opacity: 1
                    }
                }
            }
        }

            const isDark = () => { const t = document.documentElement.getAttribute('data-theme'); if (t) return t === 'dark'; return !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); };

                    sc.push([s, i, e]);

                const out = [];

            function calendar() {
                const WEEKS = 26, today = todayStr(), start = addDays(mondayOf(today), -(WEEKS - 1) * 7), tot = dayTotals(), key = S.calMetric;
                const vals = Object.values(tot).map(x => x[key]).filter(v => v > 0).sort((a, b) => a - b);
                const ref = vals.length ? Math.max(vals[Math.min(vals.length - 1, Math.floor(vals.length * 0.9))], 1) : 1;
                const months = []; for (let w = 0; w < WEEKS; w++)months.push(pd(addDays(start, w * 7)).getMonth());
                let cols = '';
                for (let w = 0; w < WEEKS; w++) {
                    const ws = addDays(start, w * 7);
                    const label = (w === 0 ? months[1] === months[0] : months[w] !== months[w - 1]) ? fmt(ws, { month: 'short' }) : '';
                    let cells = '';
                    for (let d = 0; d < 7; d++) {
                        const day = addDays(ws, d);
                        if (day > today) { cells += '<span class="cell off"></span>'; continue; }
                        const t = tot[day], v = t ? t[key] : 0, c = ramp(v / ref);
                        const txt = fmt(day, { weekday: 'long', day: 'numeric', month: 'long' }) + (t ? ' : ' + t.sets + ' séries' : ' : repos');
                        cells += '<button class="cell' + (S.calSel === day ? ' sel' : '') + '" data-act="cal" data-d="' + day + '"' + (c ? ' style="background:' + c + '"' : '') + ' title="' + esc(txt) + '" aria-label="' + esc(txt) + '"></button>';
                    }
                    cols += '<div class="wk"><span class="mlabel">' + esc(label) + '</span>' + cells + '</div>';
                }
                let info = 'Touche une case pour voir la séance du jour.';
                if (S.calSel) {
                    const t = tot[S.calSel], dl = '<b>' + esc(fmt(S.calSel, { weekday: 'long', day: 'numeric', month: 'long' })) + '</b> — ';
                    info = t ? dl + t.list.map(s => '<button class="link" data-act="open-session" data-id="' + esc(s.id) + '">' + esc(s.name || 'Séance') + '</button> (' + setsOf(s) + ' séries, ' + fmtInt(volOf(s)) + ' kg)').join(' · ') : dl + 'repos. <button class="link" data-act="new-session" data-d="' + S.calSel + '">Ajouter une séance ce jour</button>';

                host.innerHTML = '<div class="scrim" data-act="close-picker"></div><section class="sheet center" role="dialog" aria-modal="true" aria-label="Choisir un exercice"><header class="sheet-head"><button class="btn ghost small" data-act="close-picker">Annuler</button><h2>Choisir un exercice</h2><span style="width:72px"></span></header><div class="sheet-body">' +
                    '<input type="search" data-f="pkq" placeholder="Rechercher…" aria-label="Rechercher un exercice" value="' + esc(S.picker.q) + '">' +
                    '<div class="chips scroll"><button class="chip" data-act="pk-group" data-g="" aria-pressed="' + (!S.picker.g) + '">Tous</button>' + GROUPS.map(g => '<button class="chip" data-act="pk-group" data-g="' + g + '" aria-pressed="' + (S.picker.g === g) + '">' + g + '</button>').join('') + '</div>' +
                    (rec.length && !S.picker.q && !S.picker.g ? '<div><h3 style="margin-bottom:8px">Récents</h3><div class="chips">' + rec.map(id => '<button class="chip" data-act="pick" data-id="' + id + '">' + esc(EXBY.get(id).name) + '</button>').join('') + '</div></div>' : '') +
                    '<ul class="list" id="pklist" style="margin-top:0"></ul></div></section>';
                fillPickList(); syncLock();
                const i = host.querySelector('input[data-f="pkq"]'); if (i && !S.picker.focused) { S.picker.focused = true; i.focus(); }
            }
            function fillPickList() {
                const el = $('#pklist'); if (!el || !S.picker) return;
                const l = filterEx(S.picker.q, S.picker.g, null, null);
                el.innerHTML = l.length ? l.map(e => '<li><button class="xrow" data-act="pick" data-id="' + e.id + '"><span><strong>' + esc(e.name) + '</strong><small>' + esc(muscleNames(e, 3)) + '</small></span><span class="tag">' + TYPES[e.type] + '</span></button></li>').join('') : '<li style="padding:18px 2px;color:var(--muted)">Aucun résultat.</li>';
            }

            /* ---------- Import / export ---------- */
            function exportJSON() { return JSON.stringify({ app: 'carnet-de-salle', version: 1, exportedAt: new Date().toISOString(), sessions: S.data.sessions }, null, 1); }
            function exportCSV() {
                const q = v => '"' + String(v).replace(/"/g, '""') + '"', rows = [['date', 'seance', 'exercice', 'serie', 'reps', 'poids_kg'].join(';')];
                const list = S.data.sessions.slice().sort((a, b) => a.date.localeCompare(b.date));
                list.forEach(s => s.entries.forEach(en => { const ex = EXBY.get(en.exId); en.sets.forEach((x, i) => rows.push([s.date, q(s.name), q(ex ? ex.name : en.exId), i + 1, x.reps, String(x.weight).replace('.', ',')].join(';'))); }));
                return '\ufeff' + rows.join('\n');
            }
            async function saveFile(filename, data) {
                try {
                    const dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null;
                    if (dl) { await dl.save({ filename, data }); toast('Fichier prêt : ' + filename); return; }
                } catch (e) { if (e && e.code === 'declined') return; }
                S.exportText = data; S.exportName = filename; render();
            }
            function readImport(text) {
                let o; try { o = JSON.parse(text); } catch (e) { toast('Ce texte n\'est pas un JSON valide.'); return; }
                const arr = Array.isArray(o) ? o : (o && Array.isArray(o.sessions) ? o.sessions : null);
                if (!arr) { toast('Aucune séance trouvée dans ce fichier.'); return; }
                const ok = arr.map(sanitizeSession).filter(s => s && s.entries.length);
                if (!ok.length) { toast('Aucune séance valide trouvée.'); return; }
                S.pending = ok; S.confirm = null; S.pasteOpen = false; render();
            }
            function makeDemo() {
                let seed = 42; const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
                const T = {
                    Push: [['developpe_couche_halteres', 4, 9, 26], ['developpe_incline_machine', 3, 10, 40], ['developpe_epaules_machine', 3, 10, 35], ['elevations_laterales_poulie', 3, 15, 7], ['extension_triceps_poulie', 3, 12, 25]],
                    Pull: [['tirage_vertical', 3, 12, 50], ['rowing_assis_poulie', 3, 10, 45], ['face_pull', 3, 15, 20], ['curl_marteau', 3, 12, 14], ['curl_pupitre', 3, 10, 25]],
                    Legs: [['presse_cuisses', 4, 12, 120], ['leg_curl_assis', 3, 12, 40], ['leg_extension', 3, 12, 45], ['rdl', 3, 10, 50], ['mollets_debout', 4, 15, 60], ['crunch_poulie', 3, 15, 30]]
                };
                const today = todayStr(), mon = mondayOf(today), out = [];
                for (let w = 15; w >= 0; w--) {
                    const m = addDays(mon, -7 * w);
                    [['Push', 0], ['Pull', 1], ['Legs', 3], [w % 2 ? 'Push' : 'Pull', 5]].forEach(p => {
                        const date = addDays(m, p[1]); if (date > today || rnd() < 0.12) return;
                        const prog = 1 + (15 - w) * 0.012;
                        out.push({
                            id: 'demo-' + date + '-' + p[0], date, name: p[0], notes: '', demo: true, entries: T[p[0]].map(t => {
                                const raw = t[3] * prog, wt = raw > 30 ? Math.round(raw / 2.5) * 2.5 : Math.round(raw * 2) / 2;
                                return { exId: t[0], sets: Array.from({ length: t[1] }, (_, i) => ({ reps: t[2] - (i >= t[1] - 1 && rnd() < 0.5 ? 1 : 0), weight: wt })) };
                            })
                        });
                    });
                }
                return out;
            }

            /* ---------- Divers ---------- */
            let toastT;
            function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
            function syncLock() { document.body.style.overflow = (S.editor || S.picker || S.detail.length) ? 'hidden' : ''; }
            function goEx(m) { S.exMuscle = m; S.exGroup = null; S.exType = null; S.exQuery = ''; S.tab = 'ex'; S.detail = []; renderDetail(); render(); window.scrollTo(0, 0); }

            /* ---------- Événements ---------- */
            document.addEventListener('click', e => {
                const el = e.target.closest('[data-act]'); if (!el) return;
                const a = el.dataset.act, d = el.dataset;
                switch (a) {
                    case 'tab': S.tab = d.tab; S.confirm = null; render(); window.scrollTo(0, 0); break;
                    case 'period': S.period = +d.p; render(); break;
                    case 'muscle': S.sel = S.sel === d.m ? null : d.m; render(); break;
                    case 'muscle-ex': goEx(d.m); break;
                    case 'cal-metric': S.calMetric = d.k; render(); break;
                    case 'cal': S.calSel = S.calSel === d.d ? null : d.d; render(); break;
                    case 'new-session': openEditor(null, null, d.d); break;
                    case 'open-session': openEditor(d.id); break;
                    case 'sess-filter': S.sessFilter = d.n || null; render(); break;
                    case 'ex-group': S.exGroup = d.g || null; render(); break;
                    case 'ex-type': S.exType = d.t || null; render(); break;
                    case 'clear-muscle': S.exMuscle = null; render(); break;
                    case 'detail': S.detail.push(d.id); renderDetail(); { const b = $('#ov-detail .sheet-body'); if (b) b.scrollTop = 0; } break;
                    case 'detail-back': S.detail.pop(); renderDetail(); break;
                    case 'close-detail': S.detail = []; renderDetail(); break;
                    case 'detail-muscle': goEx(d.m); break;
                    case 'add-from-detail': {
                        const id = d.id; S.detail = []; renderDetail();
                        if (S.editor) { addEntry(id); renderEditor(); const b = $('#ov-editor .sheet-body'); if (b) b.scrollTop = b.scrollHeight; }
                        else openEditor(null, id);
                        break;
                    }
                    case 'close-editor': S.editor = null; S.picker = null; renderPicker(); renderEditor(); break;
                    case 'save-session': saveSession(); break;
                    case 'set-name': S.editor.draft.name = S.editor.draft.name === d.n ? '' : d.n; renderEditor(); break;
                    case 'pick-exercise': S.picker = { q: '', g: null, focused: false }; renderPicker(); break;
                    case 'close-picker': S.picker = null; renderPicker(); break;
                    case 'pk-group': S.picker.g = d.g || null; S.picker.focused = true; renderPicker(); break;
                    case 'pick': addEntry(d.id); S.picker = null; renderPicker(); renderEditor(); { const b = $('#ov-editor .sheet-body'); if (b) b.scrollTop = b.scrollHeight; } break;
                    case 'add-set': { const en = S.editor.draft.entries[+d.e], l = en.sets[en.sets.length - 1] || { reps: 10, weight: 0 }; en.sets.push({ reps: l.reps, weight: l.weight }); renderEditor(); break; }
                    case 'del-set': { const en = S.editor.draft.entries[+d.e]; en.sets.splice(+d.s, 1); renderEditor(); break; }
                    case 'e-del': S.editor.draft.entries.splice(+d.e, 1); renderEditor(); break;
                    case 'e-up': case 'e-down': { const es = S.editor.draft.entries, i = +d.e, j = a === 'e-up' ? i - 1 : i + 1; if (j >= 0 && j < es.length) { [es[i], es[j]] = [es[j], es[i]]; renderEditor(); } break; }
                    case 'dup-session': { const c = JSON.parse(JSON.stringify(S.editor.draft)); c.id = uid(); c.date = todayStr(); c.demo = false; S.editor = { draft: c, isNew: true, confirmDel: false }; renderEditor(false); const b = $('#ov-editor .sheet-body'); if (b) b.scrollTop = 0; toast('Copie créée : ajuste puis enregistre.'); break; }
                    case 'del-session':
                        if (!S.editor.confirmDel) { S.editor.confirmDel = true; renderEditor(); }
                        else { S.data.sessions = S.data.sessions.filter(s => s.id !== S.editor.draft.id); persist(); S.editor = null; renderEditor(); render(); toast('Séance supprimée'); }
                        break;
                    case 'exp-json': saveFile('carnet-de-salle-' + todayStr() + '.json', exportJSON()); break;
                    case 'exp-csv': saveFile('carnet-de-salle-' + todayStr() + '.csv', exportCSV()); break;
                    case 'copy-export': {
                        const ta = $('#export-area'); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (x) { }
                        if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(S.exportText).then(() => toast('Copié'), () => toast(ok ? 'Copié' : 'Sélectionne le texte et copie-le.')); } else toast(ok ? 'Copié' : 'Sélectionne le texte et copie-le.'); break;
                    }
                    case 'close-export': S.exportText = null; render(); break;
                    case 'imp-file': $('#imp-file').click(); break;
                    case 'imp-paste': S.pasteOpen = !S.pasteOpen; render(); break;
                    case 'imp-text': readImport($('#paste-area').value); break;
                    case 'imp-cancel': S.pending = null; S.confirm = null; render(); break;
                    case 'imp-merge': { const have = new Set(S.data.sessions.map(s => s.id)); let n = 0; S.pending.forEach(s => { if (!have.has(s.id)) { S.data.sessions.push(s); n++; } }); sortSessions(); persist(); S.pending = null; render(); toast(n + ' séance' + (n > 1 ? 's' : '') + ' ajoutée' + (n > 1 ? 's' : '')); break; }
                    case 'imp-replace':
                        if (S.confirm !== 'replace') { S.confirm = 'replace'; render(); }
                        else { S.data.sessions = S.pending; sortSessions(); persist(); S.pending = null; S.confirm = null; render(); toast('Données remplacées'); }
                        break;
                    case 'demo-load': { const have = new Set(S.data.sessions.map(s => s.id)); makeDemo().forEach(s => { if (!have.has(s.id)) S.data.sessions.push(s); }); sortSessions(); persist(); render(); toast('Démo chargée'); break; }
                    case 'demo-clear': S.data.sessions = S.data.sessions.filter(s => !s.demo); persist(); render(); toast('Démo retirée'); break;
                    case 'wipe':
                        if (S.confirm !== 'wipe') { S.confirm = 'wipe'; render(); }
                        else { S.data.sessions = []; persist(); S.confirm = null; S.calSel = null; render(); toast('Données effacées'); }
                        break;
                }
            });
            document.addEventListener('keydown', e => {
                if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.mu[data-act]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); return; }
                if (e.key === 'Escape') {
                    if (S.detail.length) { S.detail = []; renderDetail(); }
                    else if (S.picker) { S.picker = null; renderPicker(); }
                    else if (S.editor) { S.editor = null; renderEditor(); }
                }
            });
            document.addEventListener('input', e => {
                const t = e.target, f = t.dataset && t.dataset.f; if (!f) return;
                if (f === 'exq') { S.exQuery = t.value; fillExList(); return; }
                if (f === 'pkq' && S.picker) { S.picker.q = t.value; fillPickList(); return; }
                if (!S.editor) return;
                const d = S.editor.draft;
                if (f === 'date') d.date = t.value;
                else if (f === 'name') { d.name = t.value; }
                else if (f === 'notes') d.notes = t.value;
                else if (f === 'reps' || f === 'kg') {
                    const en = d.entries[+t.dataset.e], st = en && en.sets[+t.dataset.s];
                    if (st) { const v = t.value === '' ? 0 : parseFloat(String(t.value).replace(',', '.')); st[f === 'reps' ? 'reps' : 'weight'] = isFinite(v) && v >= 0 ? v : 0; }
                }
            });
            document.addEventListener('change', e => {
                if (e.target.id === 'imp-file' && e.target.files && e.target.files[0]) {
                    const r = new FileReader(); r.onload = () => readImport(String(r.result)); r.onerror = () => toast('Lecture du fichier impossible.'); r.readAsText(e.target.files[0]); e.target.value = '';
                }
            });
            try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { render(); renderDetail(); }); } catch (x) { }
            try { new MutationObserver(() => { render(); renderDetail(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (x) { }
            render();
        })();

    </script>
</body>
